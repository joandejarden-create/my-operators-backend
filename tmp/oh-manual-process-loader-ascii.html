<!-- Old Home Manual Process v1.1 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.prod.website-files.com/68108c29063eeb5d1bd7ae4a/6a6cd9146403b81b28b3a9bf_old-home-manual-process.v20260731a.css" />
<style id="dmp-shell-neutralize">
#about[data-oh-problem="manual-process"]{padding-top:0!important;padding-bottom:0!important}
#about[data-oh-problem="manual-process"] .oh-problem-shell{max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
#about[data-oh-problem="manual-process"] .oh-problem-stage{margin:0!important;padding:0!important;min-height:0!important}
#dealality-manual-process-host[data-dmp-state="loading"]{min-height:480px}
#dealality-manual-process-host[data-dmp-state="error"]{padding:48px 24px;text-align:center;color:#5b6472;font:500 15px/1.5 "Inter Tight",system-ui,sans-serif}
</style>
<div id="dealality-manual-process-host" data-dmp-state="loading" aria-busy="true">Loading...</div>
<script src="https://cdn.prod.website-files.com/68108c29063eeb5d1bd7ae4a/6a6cd9140230e8c779bd70c9_old-home-manual-process.v20260731a.js" defer data-dmp-boot-src="https://cdn.prod.website-files.com/68108c29063eeb5d1bd7ae4a/6a6cda122a93f11de49bf5fc_old-home-manual-process.v20260731a.html"></script>
<script>
(function(){
  var host=document.getElementById("dealality-manual-process-host");
  if(!host||host.getAttribute("data-dmp-boot")==="1")return;
  host.setAttribute("data-dmp-boot","1");
  var boot=document.querySelector("script[data-dmp-boot-src]");
  var htmlUrl=boot&&boot.getAttribute("data-dmp-boot-src");
  if(!htmlUrl){host.setAttribute("data-dmp-state","error");host.textContent="Missing markup URL.";return;}
  fetch(htmlUrl,{credentials:"omit",cache:"force-cache"}).then(function(r){
    if(!r.ok)throw new Error("dmp-html-"+r.status);
    return r.text();
  }).then(function(html){
    host.outerHTML=html;
  }).catch(function(err){
    console.warn("[dealality-manual-process]",err);
    var el=document.getElementById("dealality-manual-process-host");
    if(!el)return;
    el.setAttribute("data-dmp-state","error");
    el.removeAttribute("aria-busy");
    el.textContent="Unable to load this section. Please refresh and try again.";
  });
})();
</script>
