# Deal Capture / my-operators-backend — web API (default Railway config for this repo).
#
# Census V4 worker uses a SEPARATE config — do not point the web backend at it:
#   railway.census-v4-worker.toml
# In Railway → Dealality Census Worker → Settings → set Config file path to that file.
#
[build]
builder = "RAILPACK"

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = ""
healthcheckTimeout = 30
