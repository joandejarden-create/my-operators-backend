# TEMPORARY — used only for Dealality Census Worker deploys from this directory.
# Do not use for deal-capture-radar-backend web deploys (that service keeps startCommand=node server.js in Railway UI).
[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm run census:v4-full-build-worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 100
healthcheckPath = ""
healthcheckTimeout = 30
