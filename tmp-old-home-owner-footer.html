  var CSS="/* Dealality Old Home — owner-first styles */\r\n.dc-owner-root,#dc-owner-root{\r\n  font-family:'Plus Jakarta Sans',sans-serif;\r\n  color:#fff;\r\n  background:#080F25;\r\n  -webkit-font-smoothing:antialiased;\r\n}\r\n.dc-owner-root *{box-sizing:border-box}\r\n.dc-owner-root a{color:inherit;text-decoration:none}\r\n.dc-owner-root img{max-width:100%;height:auto;display:block}\r\n.dc-owner-root .dc-si{max-width:1080px;margin:0 auto;padding:0 24px}\r\n.dc-owner-root .dc-ey{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8B90FF;margin:0 0 14px}\r\n.dc-owner-root .dc-ey--gold{color:#D78E2C}\r\n.dc-owner-root .dc-h1{font-size:clamp(28px,4.2vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.12;margin:0 0 18px;max-width:16em}\r\n.dc-owner-root .dc-h2{font-size:clamp(24px,3.2vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:0 0 14px;max-width:18em}\r\n.dc-owner-root .dc-h3{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px;line-height:1.3}\r\n.dc-owner-root .dc-hsub,.dc-owner-root .dc-lead{font-size:16.5px;line-height:1.7;color:rgba(255,255,255,.62);margin:0 0 28px;max-width:40em}\r\n.dc-owner-root .dc-helper{font-size:13px;color:rgba(255,255,255,.42);margin:14px 0 0}\r\n.dc-owner-root .dc-note{font-size:14px;color:rgba(255,255,255,.45);line-height:1.6;margin:24px 0 0;max-width:42em}\r\n.dc-owner-root .dc-section{padding:88px 0;border-top:1px solid rgba(255,255,255,.07)}\r\n.dc-owner-root .dc-section--alt{background:#0D1530}\r\n.dc-owner-root .dc-btn{display:inline-block;background:#6C72FF;color:#fff!important;font-size:15px;font-weight:700;padding:13px 22px;border-radius:8px;border:none;cursor:pointer}\r\n.dc-owner-root .dc-btn:hover{background:#5A5FE6}\r\n.dc-owner-root .dc-btn--ghost{background:transparent;border:1.5px solid rgba(108,114,255,.4)}\r\n.dc-owner-root .dc-btn--ghost:hover{border-color:#6C72FF;background:rgba(108,114,255,.1)}\r\n\r\n.dc-owner-root .dc-nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:14px 24px;background:rgba(8,15,37,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}\r\n.dc-owner-root .dc-logo img{height:28px;width:auto}\r\n.dc-owner-root .dc-nav-links{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}\r\n.dc-owner-root .dc-nav-link{font-size:12px;font-weight:700;color:#fff;padding:.55rem .7rem}\r\n.dc-owner-root .dc-nav-right{display:flex;align-items:center;gap:10px}\r\n.dc-owner-root .dc-nav-signin{font-size:12px;font-weight:700;color:#D78E2C}\r\n.dc-owner-root .dc-nav-cta{font-size:12px;font-weight:700;color:#fff!important;background:#6C72FF;padding:.5rem .9rem;border-radius:6px}\r\n.dc-owner-root .dc-nmenu{display:none;background:none;border:none;color:#fff;cursor:pointer;padding:8px}\r\n.dc-owner-root .dc-mnav{position:fixed;inset:0;z-index:60;background:rgba(8,15,37,.97);padding:88px 28px 32px;display:flex;flex-direction:column;gap:4px}\r\n.dc-owner-root .dc-mnav[hidden]{display:none!important}\r\n.dc-owner-root .dc-mnav a{display:block;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:17px;font-weight:600;color:rgba(255,255,255,.7)}\r\n.dc-owner-root .dc-mnav .dc-nav-cta{margin-top:18px;text-align:center}\r\n\r\n.dc-owner-root .dc-hero{padding:96px 24px 72px;text-align:center}\r\n.dc-owner-root .dc-hero-inner{max-width:820px;margin:0 auto}\r\n.dc-owner-root .dc-hctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}\r\n.dc-owner-root .dc-path-visual{margin:40px auto 0;max-width:900px;padding:22px 18px;border:1px solid rgba(108,114,255,.28);border-radius:12px;background:rgba(13,21,48,.7)}\r\n.dc-owner-root .dc-path-steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}\r\n.dc-owner-root .dc-path-steps li{font-size:12.5px;font-weight:700;letter-spacing:.02em;color:rgba(255,255,255,.78);padding:10px 14px;border-radius:8px;background: px 18px}\r\n.dc-owner-root .dc-faq-item.is-open .dc-faq-a{display:block}\r\n.dc-owner-root .dc-faq-a p{margin:0;font-size:14.5px;color:rgba(255,255,255,.62);line-height:1.65;max-width:42em}\r\n\r\n.dc-owner-root .dc-footer{padding:48px 24px 56px;border-top:1px solid rgba(255,255,255,.07)}\r\n.dc-owner-root .dc-ft{max-width:1080px;margin:0 auto}\r\n.dc-owner-root .dc-ftag{font-size:18px;font-weight:700;margin-bottom:16px}\r\n.dc-owner-root .dc-flegal{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px}\r\n.dc-owner-root .dc-flegal a{font-size:13px;font-weight:600;color:rgba(255,255,255,.55)}\r\n.dc-owner-root .dc-fcopy{font-size:12px;color:rgba(255,255,255,.35)}\r\n\r\n@media(max-width:960px){\r\n  .dc-owner-root .dc-nav-links,.dc-owner-root .dc-nav-right{display:none}\r\n  .dc-owner-root .dc-nmenu{display:flex;margin-left:auto}\r\n  .dc-owner-root .dc-consequence-list,.dc-owner-root .dc-compare,.dc-owner-root .dc-pillars,.dc-owner-root .dc-principles,.dc-owner-root .dc-cred{grid-template-columns:1fr}\r\n  .dc-owner-root .dc-hero{padding:72px 20px 56px}\r\n  .dc-owner-root .dc-section{padding:64px 0}\r\n  .dc-owner-root .dc-founder-img{margin:0 auto}\r\n  .dc-owner-root .dc-cred{text-align:center}\r\n  .dc-owner-root .dc-cred .dc-lead{margin-left:auto;margin-right:auto}\r\n}\r\n@media(prefers-reduced-motion:reduce){\r\n  .dc-owner-root *{scroll-behavior:auto!important;transition:none!important}\r\n}\r\n\r\n/* Hide legacy Old Home canvas content when owner inject is active */\r\nhtml.dc-owner-home #dc-page > #:not(#dc-owner-root){display:none!important}\r\n";
  var HTML="<!-- Dealality Old Home — owner-first body fragment (injected into #dc-page) -->\r\n<nav class=\"dc-nav dc-nav--owner\" id=\"nav\" aria-label=\"Primary\">\r\n  <a href=\"https://www.dealality.com/old-home\" class=\"dc-logo\" aria-label=\"Dealality home\">\r\n    <img src=\"https://cdn.prod.website-files.com/68108c29063eeb5d1bd7ae4a/69c166836c109719f94e055e_Dealality%20Logo%20(4)%20(1).png\" width=\"160\" height=\"64\" alt=\"Dealality\" loading=\"eager\">\r\n  </a>\r\n  <div class=\"dc-nav-links\">\r\n    <a class=\"dc-nav-link\" href=\"#how-it-works\" data-dc-track=\"nav\">How It Works</a>\r\n    <a class=\"dc-nav-link\" href=\"#for-brands\" data-dc-track=\"secondary_audience\">For Brands and Operators</a>\r\n    <a class=\"dc-nav-link\" href=\"#for-advisors\" data-dc-track=\"secondary_audience\">For Advisors</a>\r\n    <a class=\"dc-nav-link\" href=\"#faq\" data-dc-track=\"nav\">FAQ</a>\r\n  </div>\r\n  <div class=\"dc-nav-right\">\r\n    <a class=\"dc-nav-signin\" href=\"https://www.dealality.com/login\" data-dc-track=\"signin\">Sign In</a>\r\n    <a class=\"dc-nav-cta\" href=\"/opportunity-review\" data-dc-cta=\"primary\" data-dc-loc=\"navbar\">Discuss Your Opportunity</a>\r\n  </div>\r\n  <button type=\"button\" class=\"dc-nmenu\" id=\"nmenu\" aria-label=\"Open menu\" aria-expanded=\"false\" aria-controls=\"mnav\">\r\n    <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 7h16M4 12h16M4 17h16\"/></svg>\r\n  </button>\r\n</nav>\r\n<div class=\"dc-mnav\" id=\"mnav\" hidden>\r\n  <a href=\"#how-it-works\">How It Works</a>\r\n  <a href=\"#for-brands\" data-dc-track=\"secondary_audience\">For Brands and Operators</a>\r\n  <a href=\"#for-advisors\" data-dc-track=\"secondary_audience\">For Advisors</a>\r\n  <a href=\"#faq\">FAQ</a>\r\n  <a href=\"https://www.dealality.com/login\" data-dc-track=\"signin\">Sign In</a>\r\n  <a class=\"dc-nav-cta\" href=\"/opportunity-review\" data-dc-cta=\"primary\" data-dc-loc=\"mobile_menu\">Discuss Your Opportunity</a>\r\n</div>\r\n\r\n<section class=\"dc-hero dc-hero--owner\" id=\"hero\">\r\n  <div class=\"dc-hero-inner\">\r\n    <p class=\"dc-ey dc-ey--gold\">For Hotel Owners and Developers</p>\r\n    <h1 class=\"dc-h1\">Do not let the first conversation define the future of your hotel.</h1>\r\n    <p class=\"dc-hsub\">Dealality helps owners identify credible brand, operator, and strategic paths, engage the right counterparties, compare the trade-offs, and make a defensible hotel decision.</p>\r\n    <div class=\"dc-hctas\">\r\n      <a class=\"dc-btn\" href=\"/opportunity-review\" data-dc-cta=\"primary\" data-dc-loc=\"hero\">Discuss Your Hotel Opportunity</a>\r\n      <a class=\"dc-btn dc-btn--ghost\" href=\"#how-it-works\" data-dc-cta=\"secondary\" data-dc-loc=\"hero\">See How the Process Works</a>\r\n    </div>\r\n    <p class=\"dc-helper\">Confidential initial review. No account required.</p>\r\n    <div class=\"dc-path-visual\" aria-label=\"Decision process overview\">\r\n      <ol class=\"dc-path-steps\">\r\n        <li>Strategic Paths</li>\r\n        <li>Qualified Counterparties</li>\r\n        <li>Comparable Responses</li>\r\n        <li>Negotiation Priorities</li>\r\n        <li>Defensible Decision</li>\r\n      </ol>\r\n    </div>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section\" id=\"usual-process\">\r\n  <div class=\"dc-si\">\r\n    <h2 class=\"dc-h2\">The usual process can narrow the decision before it is fully understood.</h2>\r\n    <p class=\"dc-lead\">Major hotel decisions are often shaped through existing relationships, individual presentations, scattered emails, and sequential conversations. Each input may be useful. Together, they rarely create a complete or comparable view of the opportunity.</p>\r\n    <ul class=\"dc-consequence-list\">\r\n      <li>Credible alternatives may never be explored.</li>\r\n      <li>The first available relationship may shape the opportunity too early.</li>\r\n      <li>Brand enthusiasm may be mistaken for strategic fit.</li>\r\n      <li>Proposals may rely on different assumptions.</li>\r\n      <li>Important commercial or contractual gaps may emerge late.</li>\r\n      <li>Sequential negotiation may weaken the owner’s leverage.</li>\r\n    </ul>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section dc-section--alt\" id=\"better-approach\">\r\n  <div class=\"dc-si\">\r\n    <h2 class=\"dc-h2\">A stronger decision begins with more than one credible path.</h2>\r\n    <p class=\"dc-lead\">Dealality turns one hotel opportunity into a confidential and structured selection process—so owners can understand the possibilities before committing to a particular relationship or structure.</p>\r\n    <div class=\"dc-compare\">\r\n      <div class=\"dc-compare-col\">\r\n        <h3 class=\"dc-h3\">Without a structured process</h3>\r\n        <ul>\r\n          <li>Options remain fragmented.</li>\r\n          <li>Outreach begins before the opportunity is fully packaged.</li>\r\n          <li>Responses are difficult to compare.</li>\r\n          <li>Missing terms appear late.</li>\r\n          <li>Negotiation priorities remain unclear.</li>\r\n          <li>The decision rationale is scattered across files and inboxes.</li>\r\n        </ul>\r\n      </div>\r\n      <div class=\"dc-compare-col dc-compare-col--new\">\r\n        <h3 class=\"dc-h3\">With Dealality</h3>\r\n        <ul>\r\n          <li>Credible strategic paths are identified.</li>\r\n          <li>The opportunity is prepared more clearly.</li>\r\n          <li>Relevant counterparties are approached.</li>\r\n          <li>Responses are captured using more consistent criteria.</li>\r\n          <li>Commercial and strategic trade-offs become visible.</li>\r\n          <li>The decision and its rationale are documented.</li>\r\n        </ul>\r\n      </div>\r\n    </div>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section\" id=\"outcome\">\r\n  <div class=\"dc-si\">\r\n    <h2 class=\"dc-h2\">From one hotel opportunity to a defensible decision.</h2>\r\n    <p class=\"dc-lead\">Dealality combines hospitality intelligence, structured workflow, targeted participation, comparable evidence, and human judgment around one owner decision.</p>\r\n    <div class=\"dc-pillars\">\r\n      <article><h3 class=\"dc-h3\">See the credible paths</h3><p>Understand which brand, operator, conversion, structure, or strategic-partner paths may be realistic for the hotel.</p></article>\r\n      <article><h3 class=\"dc-h3\">Prepare the opportunity</h3><p>Organize the project, objectives, evidence, requirements, and decision criteria before outreach begins.</p></article>\r\n      <article><h3 class=\"dc-h3\">Engage the right counterparties</h3><p>Approach relevant participants with stronger context and a clearer opportunity package.</p></article>\r\n      <article><h3 class=\"dc-h3\">Compare what matters</h3><p>Evaluate strategic fit, economics, requirements, restrictions, control, timing, and unresolved terms on a more consistent basis.</p></article>\r\n      <article><h3 class=\"dc-h3\">Decide with evidence</h3><p>Identify negotiation priorities and preserve a clear record of why the selected path was chosen.</p></article>\r\n    </div>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section dc-section--alt\" id=\"how-it-works\">\r\n  <div class=\"dc-si\">\r\n    <h2 class=\"dc-h2\">A structured process, supported by hospitality judgment.</h2>\r\n    <ol class=\"dc-stages\">\r\n      <li><strong>Define the opportunity</strong><span>Clarify the hotel, the owner’s objectives, the relevant decisions, and the criteria that will shape the evaluation.</span></li>\r\n      <li><strong>Identify credible paths</strong><span>Use Dealality intelligence and human review to determine which alternatives are relevant, realistic, and worth pursuing.</span></li>\r\n      <li><strong>Prepare and engage</strong><span>Create a stronger opportunity package and approach qualified brands, operators, or strategic participants.</span></li>\r\n      <li><strong>Capture and compare</strong><span>Organize responses and proposals around more consistent commercial, strategic, operating, and contractual criteria.</span></li>\r\n      <li><strong>Negotiate and decide</strong><span>Surface missing terms, establish negotiation priorities, and preserve a defensible decision record.</span></li>\r\n    </ol>\r\n    <p class=\"dc-note\">Not every opportunity proceeds through every stage. Technology supports the work; human judgment remains central.</p>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section\" id=\"product-proof\">\r\n  <div class=\"dc-si\">\r\n    <h2 class=\"dc-h2\">Built around the decision—not around the software.</h2>\r\n    <p class=\"dc-lead\">One coherent owner outcome. Brand Explorer and related intelligence support the process; they are not the entire promise.</p>\r\n    <ol class=\"dc-proof-flow\">\r\n      <li><strong>Credible strategic paths</strong> — shortlist reasoning grounded in fit signals and human review.</li>\r\n      <li><strong>Relevant counterparties</strong> — outreach readiness with clearer context.</li>\r\n      <li><strong>Comparable responses</strong> — proposal terms organized on a shared framework.</li>\r\n      <li><strong>Negotiation priorities</strong> — missing information and commercial gaps surfaced earlier.</li>\r\n      <li><strong>Decision record</strong> — a documented rationale the owner can stand behind.</li>\r\n    </ol>\r\n    <p class=\"dc-note\">Supporting capability: Brand Explorer helps determine which brands may be relevant, why they may or may not fit, whether outreach is realistic, and what remains unknown—before conversations begin.</p>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section dc-section--alt\" id=\"confidentiality\">\r\n  <div class=\"dc-si\">\r\n    <h2 class=\"dc-h2\">The opportunity remains yours.</h2>\r\n    <p class=\"dc-lead\">Dealality is designed to help owners evaluate alternatives without surrendering control of the process. Opportunities can be structured before broader outreach, sensitive information can be shared selectively, and the owner determines which relationships advance.</p>\r\n    <div class=\"dc-principles\">\r\n      <article><h3 class=\"dc-h3\">Confidential by design</h3><p>Sensitive project information is organized and shared according to the needs of the process.</p></article>\r\n      <article><h3 class=\"dc-h3\">Owner-controlled</h3><p>The owner determines which paths are explored, which parties are engaged, and what advances.</p></article>\r\n      <article><h3 class=\"dc-h3\">Structured for judgment</h3><p>Dealality organizes evidence and workflow. Important hotel decisions remain guided by human judgment.</p></article>\r\n    </div>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section\" id=\"credibility\">\r\n  <div class=\"dc-si dc-cred\">\r\n    <div>\r\n      <p class=\"dc-ey\">Hospitality experience</p>\r\n      <h2 class=\"dc-h2\">Hospitality experience, structured through Dealality.</h2>\r\n      <p class=\"dc-lead\">Dealality was developed from the realities of hotel brand, operator, development, conversion, and strategic-partner decisions. It combines structured technology with the hospitality perspective and market relationships of AO Hospitality Advisors.</p>\r\n      <p class=\"dc-wa\">— Joan DeJarden, Founder</p>\r\n    </div>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section dc-cta\" id=\"cta\">\r\n  <div class=\"dc-si dc-cta-in\">\r\n    <h2 class=\"dc-h2\">Your hotel may have more than one credible future.</h2>\r\n    <p class=\"dc-lead\">Before the first relationship or proposal defines the path, understand the alternatives around the opportunity.</p>\r\n    <a class=\"dc-btn\" href=\"/opportunity-review\" data-dc-cta=\"primary\" data-dc-loc=\"cta_section\">Discuss Your Hotel Opportunity</a>\r\n    <p class=\"dc-helper\">Begin with a confidential review. No account required.</p>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section dc-section--alt dc-secondary-band\" id=\"for-brands\">\r\n  <div class=\"dc-si\">\r\n    <h2 class=\"dc-h3\">Participating in a hotel opportunity?</h2>\r\n    <p class=\"dc-lead\">Brands, operators, advisors, and other hospitality specialists can use Dealality to receive clearer opportunity context, participate in structured evaluations, and respond through a more consistent workflow.</p>\r\n    <div class=\"dc-sec-links\">\r\n      <a href=\"https://www.dealality.com/for-brands-operators\" data-dc-track=\"secondary_audience\">For Brands and Operators</a>\r\n      <a href=\"#for-advisors\" data-dc-track=\"secondary_audience\">For Advisors and Partners</a>\r\n    </div>\r\n    <p class=\"dc-note\" id=\"for-advisors\">Secondary participation paths. The primary homepage journey remains for owners and developers with a live or upcoming hotel decision.</p>\r\n  </div>\r\n</section>\r\n\r\n<section class=\"dc-section\" id=\"faq\">\r\n  <div class=\"dc-si\">\r\n    <h2 class=\"dc-h2\">Questions owners ask</h2>\r\n    <div class=\"dc-faq-list\">\r\n      <div class=\"dc-faq-item\"><button type=\"button\" class=\"dc-faq-q\"><span>Is Dealality a broker?</span></button><div class=\"dc-faq-a\"><p>Dealality is not presented as a conventional listing or brokerage marketplace. It provides intelligence, workflow, structured outreach, comparison, and decision support around hotel opportunities. The exact commercial or advisory relationship may depend on the engagement.</p></div></div>\r\n      <div class=\"dc-faq-item\"><button type=\"button\" class=\"dc-faq-q\"><span>Does Dealality choose the brand or operator?</span></button><div class=\"dc-faq-a\"><p>No. Dealality helps the owner understand credible paths, organize evidence, compare alternatives, and make a more informed decision. Human judgment and the owner’s objectives remain central.</p></div></div>\r\n      <div class=\"dc-faq-item\"><button type=\"button\" class=\"dc-faq-q\"><span>Is the process confidential?</span></button><div class=\"dc-faq-a\"><p>Dealality is designed to support controlled and selective sharing of opportunity information. The appropriate confidentiality structure depends on the stage and participants involved.</p></div></div>\r\n      <div class=\"dc-faq-item\"><button type=\"button\" class=\"dc-faq-q\"><span>Is Dealality fully automated?</span></button><div class=\"dc-faq-a\"><p>No. Technology supports research, organization, comparison, and workflow. Human review and hospitality judgment remain important parts of the current operating model.</p></div></div>\r\n      <div class=\"dc-faq-item\"><button type=\"button\" class=\"dc-faq-q\"><span>Do I need an account to discuss an opportunity?</span></button><div class=\"dc-faq-a\"><p>No. An owner or developer can request an initial confidential review without creating a platform account.</p></div></div>\r\n      <div class=\"dc-faq-item\"><button type=\"button\" class=\"dc-faq-q\"><span>Is Dealality only for brand selection?</span></button><div class=\"dc-faq-a\"><p>No. Dealality may support decisions involving brands, operators, conversions, repositionings, new developments, mixed-use hospitality, branded residences, operating structures, and strategic partners.</p></div></div>\r\n    </div>\r\n  </div>\r\n</section>\r\n\r\n<footer class=\"dc-footer\" id=\"footer\">\r\n  <div class=\"dc-ft\">\r\n    <div class=\"dc-ftag\">Better decisions for hotel opportunities.</div>\r\n    <div class=\"dc-flegal\">\r\n      <a href=\"https://www.dealality.com/login\">Sign In</a>\r\n      <a href=\"/opportunity-review\" data-dc-cta=\"primary\" data-dc-loc=\"footer\">Discuss Your Opportunity</a>\r\n      <a href=\"mailto:joan@dealality.com\">Contact</a>\r\n    </div>\r\n    <p class=\"dc-fcopy\">© 2026 Dealality · AO Hospitality Advisors, LLC</p>\r\n  </div>\r\n</footer>\r\n";
  function track(event,extra){
    try{
      var payload=Object.assign({
        event:event,
        surface:'old_home_owner',
        path:location.pathname,
        device:innerWidth<768?'mobile':innerWidth<1024?'tablet':'desktop',
        referrer:document.referrer||'',
        landingVersion:'old-home-owner-v1'
      },extra||{});
      var body=JSON.stringify(payload);
      if(navigator.sendBeacon)navigator.sendBeacon(EV,new Blob([body],{type:'application/json'}));
      else fetch(EV,{method:'POST',headers:{'Content-Type':'application/json'},body:body,credentials:'omit',keepalive:true}).catch(function(){});
    }catch(e){}
  }
  function boot(){
    if(!document.getElementById('dc-owner-inline-css')){
      var s=document.createElement('style');
      s.id='dc-owner-inline-css';
      s.textContent=CSS;
      document.head.appendChild(s);
    }
    var page=document.getElementById('dc-page')||document.body;
    ['nav','mnav','hero','hero-overview-wrap','proofbar','problem','how','audiences','why','faq','cta','footer'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){el.style.display='none';el.setAttribute('aria-hidden','true');}
    });
    var existing=document.getElementById('dc-owner-root');
    if(existing) existing.remove();
    var rootEl=document.createElement('div');
    rootEl.id='dc-owner-root';
    rootEl.className='dc-owner-root';
    rootEl.innerHTML=HTML;
    rootEl.querySelectorAll('a[href*="opportunity-review"]').forEach(function(a){
      a.setAttribute('href',OPP);
    });
    page.insertBefore(rootEl,page.firstChild);
    document.documentElement.classList.add('dc-owner-home');
    var nmenu=rootEl.querySelector('#nmenu');
    var mnav=rootEl.querySelector('#mnav');
    function setM(open){
      if(!mnav||!nmenu)return;
      if(open)mnav.removeAttribute('hidden');
      else mnav.setAttribute('hidden','');
      nmenu.setAttribute('aria-expanded',open?'true':'false');
      document.body.style.overflow=open?'hidden':'';
    }
    if(nmenu)nmenu.addEventListener('click',function(){
      setM(mnav.hasAttribute('hidden'));
      track('mobile_nav_open');
    });
    if(mnav)mnav.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click',function(){setM(false);});
    });
    rootEl.querySelectorAll('.dc-faq-q').forEach(function(btn){
      btn.setAttribute('aria-expanded','false');
      btn.addEventListener('click',function(){
        var item=btn.closest('.dc-faq-item');
        var open=item.classList.toggle('is-open');
        btn.setAttribute('aria-expanded',open?'true':'false');
        if(open)track('homepage_faq_open',{label:(btn.textContent||'').trim().slice(0,64)});
      });
    });
    rootEl.addEventListener('click',function(ev){
      var t=ev.target&&ev.target.closest&&ev.target.closest('a,button');
      if(!t)return;
      var cta=t.getAttribute('data-dc-cta');
      if(cta==='primary'){
        track('homepage_primary_cta_click',{location:t.getAttribute('data-dc-loc')||'unknown'});
        track('cta_click',{label:'discuss_your_hotel_opportunity',location:t.getAttribute('data-dc-loc')||'unknown'});
      }
      if(cta==='secondary')track('homepage_secondary_cta_click',{location:t.getAttribute('data-dc-loc')||'unknown'});
      if(t.getAttribute('data-dc-track')==='signin')track('signin_click');
      if(t.getAttribute('data-dc-track')==='secondary_audience'){
        track('secondary_audience_click',{label:(t.textContent||'').trim().slice(0,64)});
      }
    });
    rootEl.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener('click',function(e){
        var id=(a.getAttribute('href')||'').slice(1);
        var el=id&&rootEl.querySelector('#'+CSS.escape(id));
        if(!el)return;
        e.preventDefault();
        el.scrollIntoView({behavior:'smooth',block:'start'});
        try{history.pushState(null,'','#'+id);}catch(err){}
      });
    });
    if('IntersectionObserver' in window){
      var how=rootEl.querySelector('#how-it-works');
      if(how){
        var seen=false;
        new IntersectionObserver(function(entries){
          entries.forEach(function(x){
            if(x.isIntersecting&&!seen){seen=true;track('how_it_works_view');}
          });
        },{threshold:0.35}).observe(how);
      }
    }
    track('homepage_view');
    track('page_land');
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
