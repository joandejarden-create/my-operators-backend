<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Alignment Snapshot - Dealality</title>
    <link rel="stylesheet" href="/css/brand-alignment-snapshot.css">
    <link rel="stylesheet" href="/css/operator-alignment-snapshot.css?v=oas-cover-265">
    <link rel="stylesheet" href="/css/operator-alignment-companies.css">
    <link rel="stylesheet" href="/css/snapshot-page-shell.css">
</head>
<body>
    <div class="snapshot-page bas-page" id="oasPage">
        <div class="bas-page-loading" id="oasPageLoading" role="status" aria-live="polite">
            <div class="loading">
                <div class="loading-content">
                    <div class="wave-container">
                        <div class="wave wave-1"></div>
                        <div class="wave wave-2"></div>
                        <div class="wave wave-3"></div>
                        <div class="wave-particles">
                            <div class="particle"></div>
                            <div class="particle"></div>
                            <div class="particle"></div>
                            <div class="particle"></div>
                        </div>
                    </div>
                    <div>
                        <div class="loading-text-main">Building Operator Alignment Snapshot…</div>
                    </div>
                </div>
                <div class="loading-progress"><div class="loading-progress-bar"></div></div>
            </div>
        </div>
        <div id="oasPageRoot" hidden></div>
    </div>
    <script src="/js/dealality-memberstack-auth.js"></script>
    <script src="/js/operator-alignment-snapshot.js?v=oas-cover-265"></script>
    <script>
    (function () {
        var params = new URLSearchParams(window.location.search || "");
        var dealId = (params.get("dealId") || "").trim();
        var chromeless =
            params.get("embed") === "1" ||
            params.get("embed") === "true" ||
            window !== window.top;
        var autoPrint = params.get("print") === "1";
        var page = document.getElementById("oasPage");
        var loading = document.getElementById("oasPageLoading");
        var root = document.getElementById("oasPageRoot");

        if (page) {
            page.classList.add("bas-page--full", "snapshot-page--full");
            if (chromeless) page.classList.add("bas-page--chromeless");
        }

        function showError(msg) {
            if (loading) loading.style.display = "none";
            if (root) {
                root.hidden = false;
                root.innerHTML =
                    '<div class="bas-page-error">' +
                    String(msg || "Request failed").replace(/</g, "&lt;") +
                    "</div>";
            }
        }

        if (!dealId || dealId.indexOf("rec") !== 0) {
            showError("A valid dealId query parameter is required (e.g. ?dealId=rec…).");
            return;
        }

        function runSnapshot() {
            var fetchFn =
                window.DealalityMemberstackAuth && window.DealalityMemberstackAuth.fetchMyDealsApi
                    ? window.DealalityMemberstackAuth.fetchMyDealsApi.bind(window.DealalityMemberstackAuth)
                    : function (url, opts) {
                          return fetch(url, opts);
                      };

            function fetchProfileJson(url) {
                return fetchFn(url, { method: "GET" }).then(function (r) {
                    if (r.status === 401 || r.status === 403) {
                        throw new Error("Sign in required to view this snapshot. Open from My Deals while logged in.");
                    }
                    return r.json().then(function (body) {
                        return { ok: r.ok, status: r.status, body: body };
                    });
                });
            }

            var companiesPromise =
                window.OperatorAlignmentSnapshot && window.OperatorAlignmentSnapshot.fetchCompaniesApiPack
                    ? window.OperatorAlignmentSnapshot.fetchCompaniesApiPack(fetchFn, dealId)
                    : fetchFn(
                          "/api/operator-alignment-snapshot/" + encodeURIComponent(dealId) + "/companies",
                          { method: "GET" }
                      ).then(function (r) {
                          return r.json().then(function (body) {
                              return { ok: r.ok, status: r.status, body: body };
                          });
                      });

            Promise.all([
                fetchProfileJson("/api/operator-alignment-snapshot/" + encodeURIComponent(dealId) + "/profile"),
                companiesPromise,
            ])
                .then(function (results) {
                    var profilePack = results[0];
                    var companiesPack = results[1];
                    var data = profilePack.body || {};
                    if (!profilePack.ok || !data.success) {
                        var errMsg = data.error || "Could not load Operator Alignment Snapshot.";
                        if (String(errMsg).toLowerCase().indexOf("not found") >= 0) {
                            errMsg = "Deal not found or you do not have access to this deal.";
                        }
                        showError(errMsg);
                        return;
                    }
                    if (window.OperatorAlignmentSnapshot && window.OperatorAlignmentSnapshot.attachCompaniesSnapshot) {
                        window.OperatorAlignmentSnapshot.attachCompaniesSnapshot(data, companiesPack);
                    } else if (companiesPack.ok && companiesPack.body && companiesPack.body.success) {
                        data.companiesSnapshot = companiesPack.body;
                    } else {
                        data.companiesSnapshot = {
                            mode: "companies",
                            companiesAvailable: false,
                            gatingReason:
                                "Company-level operator alignment could not be loaded. Profile-level alignment remains available above.",
                            companiesForConsideration: [],
                        };
                    }
                    if (loading) loading.style.display = "none";
                    if (!root || !window.OperatorAlignmentSnapshot) {
                        showError("Snapshot renderer failed to load.");
                        return;
                    }
                    root.hidden = false;
                    var dealName =
                        (data.dealContext && data.dealContext.dealName) || "Deal";
                    document.title = dealName + " — Operator Alignment Snapshot";
                    window.OperatorAlignmentSnapshot.render(root, data, {
                        embed: chromeless,
                        fullPage: true,
                        dealId: dealId,
                        backHref: chromeless ? "" : "/my-deals.html",
                        generatedAt: data.generatedAt || new Date().toISOString(),
                    });
                    if (autoPrint) {
                        window.setTimeout(function () {
                            var snap = root.querySelector(".operator-alignment-snapshot");
                            if (snap && window.OperatorAlignmentSnapshot) {
                                var btn = snap.querySelector("[data-bas-print]");
                                if (btn) btn.click();
                            }
                        }, 600);
                    }
                })
                .catch(function (err) {
                    showError(err.message || "Network error");
                });
        }

        if (window.DealalityMemberstackAuth && typeof window.DealalityMemberstackAuth.whenReady === "function") {
            window.DealalityMemberstackAuth.whenReady(runSnapshot);
        } else {
            runSnapshot();
        }
    })();
    </script>
</body>
</html>
