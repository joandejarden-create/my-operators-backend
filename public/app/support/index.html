<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Support — Dealality</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/support-runbook.css">
  <script>(function(){if(window.location.search.indexOf('embed=1')!==-1||window!==window.top){document.documentElement.classList.add('embed-mode');}})();</script>
</head>
<body class="support-page">
  <div class="support-page-shell" id="supportGateContent">
    <header class="support-page-header">
      <div class="support-badge-row">
        <span class="support-badge">Support</span>
      </div>
      <h1>Help &amp; Support</h1>
      <p>Platform guidance and help for Dealality users.</p>
    </header>

    <div class="support-card-list">
      <div class="support-card" style="cursor: default;">
        <h2>Need help with the platform?</h2>
        <p>Contact your Dealality administrator or support contact for account access, workspace setup, or deal visibility issues.</p>
        <div class="support-card-meta">General support</div>
      </div>
    </div>
  </div>

  <script src="/embed-chrome.js" defer></script>
</body>
</html>
