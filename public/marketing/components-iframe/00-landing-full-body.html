</style>
<div class="dl-landing-embed-wrap">
  <iframe
    id="dealality-landing-embed"
    class="dl-landing-embed-iframe"
    src="https://my-operators-backend-staging.up.railway.app/marketing/dealality-landing-v7.html?embed=1"
    title="Dealality — hotel brand and operator selection"
    scrolling="no"
    allow="fullscreen"
    allowfullscreen
    webkitallowfullscreen
    style="display:block;width:100%;height:3200px;border:0;background:#080f25;overflow:hidden"
  ></iframe>
</div>
<script>
(function () {
  var STYLE_ID = "dl-landing-shell-scrollbar";
  if (!document.getElementById(STYLE_ID)) {
    var style = document.createElement("style");
    style.id = STYLE_ID;
    style.textContent =
      "html,body{scrollbar-width:thin!important;scrollbar-color:#6c72ff #080f25!important}" +
      "html::-webkit-scrollbar,body::-webkit-scrollbar{width:8px!important}" +
      "html::-webkit-scrollbar-track,body::-webkit-scrollbar-track{background:#080f25!important;border-left:1px solid rgba(87,195,255,.35)!important}" +
      "html::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb{background:#6c72ff!important}" +
      "html::-webkit-scrollbar-thumb:hover,body::-webkit-scrollbar-thumb:hover{background:#8b90ff!important}";
    (document.head || document.documentElement).appendChild(style);
  }
  function applyNavOffset() {
    var nav =
      document.querySelector(".navbar-2.w-nav") ||
      document.querySelector('[role="banner"].w-nav') ||
      document.querySelector(".w-nav");
    var heroGapBelowNavPx = 8;
    var offset = nav ? Math.ceil(nav.getBoundingClientRect().height) : 48;
    var wrap = document.querySelector(".dl-landing-embed-wrap");
    if (wrap) {
      wrap.style.paddingTop = offset + heroGapBelowNavPx + "px";
      wrap.style.minHeight = "0";
    }
    document.body.classList.remove("overflow-hidden", "h-100-vh");
  }
  applyNavOffset();
  document.addEventListener("DOMContentLoaded", applyNavOffset);
  window.addEventListener("load", applyNavOffset);
  window.addEventListener("resize", applyNavOffset);
})();
</script>
<script src="https://my-operators-backend-staging.up.railway.app/marketing/dealality-landing-webflow-parent.js" defer></script>
