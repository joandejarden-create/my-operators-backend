<!DOCTYPE html>
<html lang="en" class="becs-page" data-brand-explorer-unified-tabs="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Explorer Comparison Studio — Dealality (Internal)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/dealality-explorer-platform.css" />
  <link rel="stylesheet" href="/css/brand-explorer-atelier-list-parity.css?v=3" />
  <link rel="stylesheet" href="/css/brand-explorer-gold-surface.css" />
  <link rel="stylesheet" href="/css/brand-explorer-atelier-oe-panels.css" />
  <link rel="stylesheet" href="/css/brand-explorer-compare-studio.css" />
</head>
<body>
  <div class="becs-shell becs-shell-paired">
    <header class="becs-topbar">
      <h1>Brand Explorer Comparison Studio</h1>
      <span class="becs-badge">Internal · Phase 2G · Paired subsections · No Airtable writes</span>
      <div class="becs-controls">
        <label>Brand
          <select id="becsBrand"></select>
        </label>
        <div id="becsTabs" class="becs-tabbar"></div>
        <div id="becsViewModes" class="becs-modes">
          <button type="button" class="becs-mode active" data-becs-mode="full">Full subsection comparison</button>
          <button type="button" class="becs-mode" data-becs-mode="changes">Changes only</button>
        </div>
        <button type="button" id="becsExport">Export review report</button>
      </div>
    </header>

    <div class="becs-summary" id="becsSummary" aria-label="Changes summary"></div>
    <div class="becs-scorecard" id="becsScorecard"></div>
    <div class="becs-quality-filters" id="becsQualityFilters" aria-label="Filters"></div>

    <div class="becs-paired-layout">
      <aside class="becs-sidebar">
        <h2>Subsections</h2>
        <nav id="becsSubnav" class="becs-subnav" aria-label="Subsection navigation"></nav>
        <h2>Changed fields</h2>
        <ul class="becs-change-list" id="becsChangeList"></ul>
      </aside>
      <main class="becs-doc-scroll" id="becsDocScroll">
        <div class="becs-col-heads sticky">
          <div><strong>LEFT — Existing production</strong> <span class="tag" id="becsLeftTag">…</span></div>
          <div><strong>RIGHT — Reconstructed factory</strong> <span class="tag" id="becsRightTag">…</span></div>
        </div>
        <div id="becsPairedDoc" class="becs-paired-doc"></div>
      </main>
    </div>

    <div class="becs-review-drawer" id="becsReviewDrawer">
      <h3>Field review</h3>
      <p class="becs-review-meta">Select a changed field or subsection.</p>
    </div>
    <div class="becs-status-bar" id="becsStatus">Starting…</div>
  </div>

  <script src="/js/brand-explorer-compare-studio.js"></script>
</body>
</html>
