    function showGoldProfileLoadError(message) {

      var metaEl = document.getElementById("heroMeta");
      var tabsEl = document.getElementById("tabs");
      var panelsRoot = document.getElementById("panels");
      var logoEl = document.getElementById("heroLogo");

      var stmtEl = document.querySelector(".hero .statement");
      if (nameEl) nameEl.textContent = "Operator profile unavailable";
      if (logoEl) logoEl.style.display = "none";
      if (tagEl) tagEl.style.display = "none";
      if (stmtEl) stmtEl.style.display = "none";

        metaEl.innerHTML = "";

      }
    }

    document.addEventListener("DOMContentLoaded", async function () {

        try {
          await window.OperatorExplorerFavorites.ready();
        } catch (_) {}
      }
      var params = new URLSearchParams(window.location.search || "");
      var id = params.get("id") || params.get("operatorId") || params.get("recordId");
      var popupToken = params.get("popupToken") || "";
      var isLive = false;
      if (id) {
        document.documentElement.classList.add("gold-profile--loading");

          var r = await window.OperatorExplorerGoldMock.bootstrap();
