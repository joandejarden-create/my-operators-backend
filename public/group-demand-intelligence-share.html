<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Group & Demand Intelligence — Dealality</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/deal-workspace-shell.css" />
  <link rel="stylesheet" href="/js/ai-visibility/ai-visibility-shared.css?v=gdi-drawer-load-20260924" />
  <link rel="stylesheet" href="/css/group-demand-intelligence.css?v=gdi-drawer-load-20260924" />
</head>
<body class="gdi-page gdi-share-mode aiv-page">
  <!-- Canonical intelligence-product loading toast — parity with auth GDI / Brand AI -->
  <div
    class="bdd-toast aiv-loading-toast show"
    id="gdiShareLoading"
    role="status"
    aria-live="polite"
    aria-busy="true"
    style="display: flex"
  >
    <div class="toast-wave-container" aria-hidden="true">
      <div class="wave-container">
        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>
        <div class="wave-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
      </div>
    </div>
    <div class="toast-message" id="gdiShareLoadingMessage">Loading Group Demand Intelligence…</div>
  </div>
  <div class="gdi-shell dashboard-container aiv-dashboard" id="gdiShareRoot"></div>
  <dialog class="gdi-drawer" id="gdiShareDrawer" aria-label="Opportunity detail">
    <div class="gdi-drawer-inner">
      <header class="gdi-drawer-head">
        <h2 id="gdiShareDrawerTitle">Opportunity</h2>
        <button type="button" class="gdi-btn gdi-btn-ghost" id="gdiShareDrawerClose">Close</button>
      </header>
      <div class="gdi-drawer-body" id="gdiShareDrawerBody"></div>
    </div>
  </dialog>
  <script src="/js/group-demand-intelligence/dealality-gdi-ui.js?v=gdi-drawer-load-20260924"></script>
  <script src="/js/group-demand-intelligence/share-app.js?v=gdi-drawer-load-20260924"></script>
</body>
</html>
