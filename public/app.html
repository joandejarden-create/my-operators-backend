<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealality – App</title>
    <link rel="stylesheet" href="/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="deal-capture-logo">
                    <img src="https://cdn.prod.website-files.com/68108c29063eeb5d1bd7ae4a/69c1b01260955aa2357ee675_Dealality%20Full%20Logo%20w%20Text%20(Transparant).png" alt="Dealality" loading="lazy">
                </div>
                <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar">
                    <span class="chevron left">&lt;</span>
                    <span class="chevron right">&gt;</span>
                </button>
            </div>
            <div class="search-wrap">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input type="text" class="search-input" id="shellSearchInput" placeholder="Search for..." aria-label="Search navigation">
            </div>
            <nav class="sidebar-nav" id="shellNav" aria-label="Main navigation"></nav>

            <div class="dev-workspace-wrap workspace-switcher-wrap" id="devWorkspaceWrap" hidden>
                <label for="devWorkspaceSelect" class="dev-workspace-label workspace-switcher-label">Workspace</label>
                <select id="devWorkspaceSelect" class="dev-workspace-select workspace-switcher-select" aria-label="Select active workspace">
                </select>
                <div class="workspace-demo-brand-portfolio" id="workspaceDemoBrandPortfolio" hidden>
                    <label for="devBrandPortfolioSelect" class="dev-workspace-label">Brand Portfolio</label>
                    <select id="devBrandPortfolioSelect" class="dev-workspace-select workspace-switcher-select" aria-label="Select demo Brand portfolio">
                    </select>
                    <p class="workspace-demo-helper">Founder/demo QA only — simulates entitled Brand company portfolio.</p>
                </div>
                <div class="workspace-demo-context" id="workspaceDemoContext" hidden>
                    <span class="workspace-demo-badge">Demo Mode</span>
                    <p class="workspace-demo-helper">Preview workspace views without production permissions.</p>
                </div>
                <div class="workspace-dev-tools" id="workspaceDevTools" hidden>
                    <select id="devNavOverrideSelect" class="dev-workspace-select workspace-dev-override-select" aria-label="Local dev navigation override">
                        <option value="">— Production nav —</option>
                        <option value="admin">Admin</option>
                        <option value="all">All Workspaces</option>
                    </select>
                    <a href="/webflow-preview.html" target="_blank" rel="noopener noreferrer" class="dev-workspace-preview-btn">
                        Open Webflow Preview
                    </a>
                </div>
            </div>

            <div class="sidebar-footer" id="accountDropdownWrap">
                <button type="button" class="user-block account-dropdown-trigger" id="accountDropdownTrigger" aria-haspopup="true" aria-expanded="false" aria-label="Account settings">
                    <span class="user-avatar" aria-hidden="true">D</span>
                    <div class="user-info">
                        <span class="user-name">Dealality Demo</span>
                        <span class="user-meta">Account settings</span>
                    </div>
                    <span class="nav-arrow nav-arrow-dropdown" aria-hidden="true">▾</span>
                </button>
                <div class="account-dropdown" id="accountDropdownMenu" role="menu" aria-hidden="true">
                    <div class="account-dropdown-header">
                        <span class="user-avatar" aria-hidden="true">D</span>
                        <div class="user-info">
                            <span class="user-name">Dealality Demo</span>
                            <span class="user-meta">Account settings</span>
                        </div>
                    </div>
                    <a class="account-dropdown-item" href="/profile-settings" data-href="/profile-settings" role="menuitem">
                        <span class="account-dropdown-icon" aria-hidden="true">⚙</span>
                        Profile settings
                    </a>
                    <a class="account-dropdown-item" href="#" data-href="#" role="menuitem">
                        <span class="account-dropdown-icon" aria-hidden="true">🏨</span>
                        Hotel Ownership
                    </a>
                    <a class="account-dropdown-item" href="#" data-href="#" role="menuitem">
                        <span class="account-dropdown-icon" aria-hidden="true">🔔</span>
                        Notifications
                    </a>
                    <div class="account-dropdown-divider" role="separator"></div>
                    <a class="account-dropdown-item" href="#" data-href="#" role="menuitem">
                        <span class="account-dropdown-icon" aria-hidden="true">ℹ</span>
                        Help center
                    </a>
                    <a class="account-dropdown-item" href="#" data-href="#" role="menuitem">
                        <span class="account-dropdown-icon" aria-hidden="true">🎧</span>
                        Support
                    </a>
                    <button type="button" class="account-dropdown-item account-dropdown-logout" id="accountLogout" role="menuitem">
                        <span class="account-dropdown-icon" aria-hidden="true">⎋</span>
                        Log out
                    </button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div id="frameContainer" class="frame-container"></div>
            <footer class="app-shell-footer" role="contentinfo">
                <span id="appShellCopyrightYear"></span> Copyright © Dealality
            </footer>
        </main>
    </div>
    <script>
        window.DEALALITY_API_BASE = window.location.origin;
    </script>
    <script src="/js/dealality-memberstack-auth.js"></script>
    <script src="/js/dealality-webflow-embed-parent.js"></script>
    <script src="/js/dealality-webflow-user-chrome.js"></script>
    <script src="/js/dealality-app-shell-auth.js"></script>
    <script src="/js/dealality-ui-labels.js"></script>
    <script src="/js/dealality-stakeholder-nav.js"></script>
    <script src="/app.js?v=ma-1.3.4" defer></script>
</body>
</html>
