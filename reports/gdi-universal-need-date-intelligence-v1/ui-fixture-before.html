<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GDI Need Dates — before (no hotel status intelligence)</title>
  <link rel="stylesheet" href="/public/css/group-demand-intelligence.css" />
  <style>
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: #0b1020; color: #e8ebf2; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
    .panel { border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 18px 20px; margin: 0 0 20px; background: #121826; }
    .panel h2 { margin: 0 0 12px; font-size: 18px; }
    .muted { color: #a8b0c0; font-size: 13px; }
    .gdi-need-dates-heading h2 { margin: 0; font-size: 1.15rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Need Dates — before hotel configuration statuses</h1>
    <p class="muted">Baseline: Need Dates heading only. No Confirmed / Market Estimated / Not Established hotel status, no info legend.</p>
    <section class="panel">
      <h2>Any GDI hotel</h2>
      <div class="gdi-need-dates-heading" data-section="need-dates-heading">
        <h2>Need Dates</h2>
      </div>
      <p class="muted">No hotel-level need-date configuration status was rendered.</p>
    </section>
  </div>
</body>
</html>
