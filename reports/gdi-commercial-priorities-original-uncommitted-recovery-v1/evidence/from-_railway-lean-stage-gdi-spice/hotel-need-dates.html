<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hotel Commercial Priorities — Dealality</title>
  <link rel="stylesheet" href="/css/dealality-intake-form-shell.css?v=hcp-v3" />
  <link rel="stylesheet" href="/css/hotel-commercial-priorities.css?v=hcp-v3b" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #080f25;
      color: #aeb9e1;
      font-family: "Mona sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .hcp-loading {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(108, 114, 255, 0.35);
      background: rgba(16, 25, 53, 0.96);
      color: #fff;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .hcp-loading.show { display: flex; }
  </style>
</head>
<body class="hcp-page">
  <div
    class="hcp-loading"
    id="hndLoading"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <span id="hndLoadingMessage">Loading Hotel Commercial Priorities…</span>
  </div>
  <div id="hndRoot"></div>
  <script src="/js/dealality-memberstack-auth.js"></script>
  <script src="/js/group-demand-intelligence/hotel-commercial-priorities-app.js?v=hcp-v3c"></script>
</body>
</html>
