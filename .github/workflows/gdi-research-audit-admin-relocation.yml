name: GDI Research Audit admin relocation

on:
  pull_request:
    branches: [main]
    paths:
      - "public/app/admin/ai-demand-admin.html"
      - "public/js/admin-ai-demand-admin.js"
      - "public/js/admin-gdi-research-audit.js"
      - "public/js/group-demand-intelligence/app.js"
      - "public/js/group-demand-intelligence/share-app.js"
      - "public/js/group-demand-intelligence/dealality-gdi-ui.js"
      - "api/group-demand-intelligence.js"
      - "server.js"
      - "lib/group-demand-intelligence/customer-safe-run-status-label-v1.js"
      - "scripts/test-gdi-research-audit-admin-relocation-v1.mjs"
      - ".github/workflows/gdi-research-audit-admin-relocation.yml"
  push:
    branches: [main]
    paths:
      - "public/js/admin-gdi-research-audit.js"
      - "scripts/test-gdi-research-audit-admin-relocation-v1.mjs"
      - ".github/workflows/gdi-research-audit-admin-relocation.yml"

jobs:
  relocation-static:
    name: Research Audit relocation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Relocation static contracts
        run: npm run test:gdi-research-audit-admin-relocation-v1
