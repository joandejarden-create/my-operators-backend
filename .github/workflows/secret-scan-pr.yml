name: Secret scan (PR)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded PR runs so intermediate failures do not keep emailing after a fix push.
# Main push scans still run; production security is not weakened.
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Discovers repo-root .gitleaks.toml (share-registry allowlists).
