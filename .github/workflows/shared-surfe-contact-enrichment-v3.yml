# Permanent shared Surfe + dynamic missing-channel enrichment gate (HE + GDI).
# Mock/regression only — never spends Surfe credits in CI.
name: Shared Surfe contact enrichment V3

concurrency:
  group: shared-surfe-contact-v3-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/surfe/**"
      - "lib/shared-contact-intelligence/**"
      - "lib/hotel-intelligence/contact-intelligence/**"
      - "lib/group-demand-intelligence/gdi-surfe-contact-provider-v1.js"
      - "lib/group-demand-intelligence/gdi-contact-on-demand-reveal-v1.js"
      - "lib/market-alerts-contact/surfe-adapter.js"
      - "api/contact-intelligence.js"
      - "public/js/hotel-contact-intelligence.js"
      - "public/css/hotel-contact-intelligence.css"
      - "scripts/test-he-surfe-contact-parity-v1.mjs"
      - "scripts/test-he-contact-dynamic-enrich-v3.mjs"
      - "scripts/test-shared-missing-channel-enrichment-global-v3.mjs"
      - "scripts/test-gdi-surfe-on-demand-contact-reveal-v1.mjs"
      - "package.json"
      - ".github/workflows/shared-surfe-contact-enrichment-v3.yml"
  push:
    branches: [main]
    paths:
      - "lib/surfe/**"
      - "lib/shared-contact-intelligence/**"
      - "lib/hotel-intelligence/contact-intelligence/**"
      - "lib/group-demand-intelligence/gdi-surfe-contact-provider-v1.js"
      - "api/contact-intelligence.js"
      - "public/js/hotel-contact-intelligence.js"
      - ".github/workflows/shared-surfe-contact-enrichment-v3.yml"

jobs:
  shared-surfe-gates:
    name: Shared Surfe + missing-channel gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Surfe LinkedIn + session parity (HE)
        run: npm run test:he-surfe-contact-parity-v1

      - name: Dynamic missing-channel enrichment V3 (HE)
        run: npm run test:he-contact-dynamic-enrich-v3

      - name: Shared missing-channel enrichment GLOBAL V3 (HE+GDI)
        run: npm run test:shared-missing-channel-enrichment-global-v3

      - name: GDI Surfe on-demand reveal (session-only)
        run: npm run test:gdi-surfe-on-demand-contact-reveal-v1
