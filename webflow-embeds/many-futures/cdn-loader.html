<!-- Many Futures Phase B — CDN loader (Webflow HtmlEmbed) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/OWNER/REPO@BRANCH/webflow-embeds/many-futures/many-futures.css" />
<div id="mf-embed-host"></div>
<script>
(function(){
  var host=document.getElementById("mf-embed-host");
  if(!host) return;
  fetch("https://cdn.jsdelivr.net/gh/OWNER/REPO@BRANCH/webflow-embeds/many-futures/markup.html").then(function(r){return r.text();}).then(function(html){
    host.innerHTML=html;
    var s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/gh/OWNER/REPO@BRANCH/webflow-embeds/many-futures/many-futures.js";
    document.body.appendChild(s);
  });
})();
</script>
