# Dealality gitleaks config - extends defaults; scoped allowlists only.
title = "Dealality secret scan"

[extend]
useDefault = true

# Gitleaks 8.24.x uses the singular global allowlist.
# Path entries exempt an entire file. Active share-token registries are not path-exempt,
# so a real key in those files is still reported.
[allowlist]
description = "Known-safe Dealality metadata and generated identifiers"
condition = "OR"
regexTarget = "line"

paths = [
  '''scripts/playwright-adp-owner-app-shell-property-access-v1\.mjs$''',
  '''lib/ai-demand-positioning/brand-portfolio/bpp-publication-meta-v1\.js$''',
  '''public/adp-core-trends-p2-deploy-marker\.json$''',
  '''data/ai-visibility/exports/_chrome-print-profile/Default/Extensions/lmjegmlicamnimmfhcmpkclmigmmcbeh/3\.10_0/manifest\.json$''',
  '''data/ai-visibility/exports/_chrome-print-profile-howto/Default/Extensions/lmjegmlicamnimmfhcmpkclmigmmcbeh/3\.10_0/manifest\.json$''',
  '''reports/ihg-destination-page-snippet\.html$''',
  '''reports/ihg-dr-destination\.html$''',
  '''reports/ihg-page-probe\.html$''',

  # Generated Airtable schema inventories. Contain object IDs, not PAT credentials.
  '''reports/operator-setup-form-field-coverage-matrix\.json$''',
  '''reports/operator-field-usage-matrix\.json$''',
  '''reports/operator-setup-field-inventory\.json$''',

  # Captured public browser HTML.
  '''reports/ihg-resources-page-snippet\.html$''',
  '''reports/_tmp-even-dev\.html$''',
  '''fixtures/choice-dev-site-home\.html$''',

  # Static generated/cache artifacts already reviewed; findings are metadata/URLs/IDs.
  '''data/contact-intelligence/evals/gdi-wave1-who-v11-refreeze\.json$''',
  '''data/group-demand-intelligence/hotels/recLuxvwwxID7U2B8/opportunities\.json$''',
  '''data/pilots/bethesda-marriott-001/pilot-master\.json$''',
  '''data/research-engine-v2/serpapi-research-cache/raw/735f2e37c4df8c0d9bc4ba681ee114e8ab9bc6c7\.json$''',
  '''data/research-engine-v2/serpapi-research-cache/raw/c9e2bf2439c5946e9040bd9d0dee0947b92e4a16\.json$''',
  '''reports/bethesda-pilot/day1/2026-10-01/PILOT_MASTER_RECORD\.json$''',
  # Bethesda contact-apply coverage JSON may embed public portal URL query tokens (hkey=), not Dealality secrets.
  '''reports/gdi-bethesda-88-apply-approved-canonical-contact-patches-v1/.*\.json$''',
  # Wyndham Exa raw-runs embed public ASP.NET/SharePoint sponsorship URLs with hkey= UUID query tokens (PR #287).
  '''reports/gdi-wyndham-alltra-20usd-full-e2e-v1/raw-runs/.*\.json$''',
  # Radisson Blu Toronto $15 paid Full E2E: research run keys + public CalendarEventKey URLs in reports/raw-runs (PR #290).
  '''reports/gdi-radisson-blu-toronto-paid-full-e2e-15usd-v1/.*\.json$''',
  '''reports/gdi-radisson-blu-toronto-paid-full-e2e-15usd-v1/raw-runs/.*\.json$''',
  # Radisson Blu Toronto $20 14-segment Exa expansion: research run keys + public CalendarEventKey URLs in reports/raw-runs.
  '''reports/gdi-radisson-toronto-14-segment-exa-expansion-20usd-v1/.*\.json$''',
  '''reports/gdi-radisson-toronto-14-segment-exa-expansion-20usd-v1/raw-runs/.*\.json$''',
  # Radisson operational Airtable certification: publication package IDs can trip generic-api-key (PR #299).
  '''reports/gdi-radisson-toronto-final-operational-certification-v1/.*\.json$''',
  # Toronto ADP customer share activation reports: prose references to public sht_ token ids (PR #325).
  '''reports/adp/radisson-blu-toronto-customer-share-activation-v1/.*$''',
  # YOTEL Geneva Lake $35 Exa pilot: research run keys + URLs in reports/raw-runs.
  '''reports/gdi-yotel-geneva-lake-40plus-exa-expansion-v1/.*\.json$''',
  '''reports/gdi-yotel-geneva-lake-40plus-exa-expansion-v1/raw-runs/.*\.json$''',
  # YOTEL Geneva Lake $30 Exa scale: research run keys (`rx_d_<hex>`, recoveryKey) + public URLs in reports/raw-runs.
  '''reports/gdi-yotel-geneva-lake-exa-30usd-scale-v1/.*\.json$''',
  '''reports/gdi-yotel-geneva-lake-exa-30usd-scale-v1/raw-runs/.*\.json$''',
  # YOTEL $30 staged publication package IDs / fingerprints (generic-api-key FP).
  '''lib/group-demand-intelligence/bundled-publication-packages/recrPQcZg7SFARRb2/gdi_pub_recrPQcZg7SFARRb2_20261117_yotel_geneva_lake_exa_30usd_scale_v1/.*\.json$''',
  '''data/group-demand-intelligence/hotels/recrPQcZg7SFARRb2/opportunities\.json$''',
  # Persistence adapter dry-run manifests: Demand Generator soft identity hashes (dg_*), not API secrets (PR #363).
  '''reports/gdi-full-e2e-airtable-persistence-adapter-v1/BETHESDA_EXACT_WRITE_MANIFEST\.json$''',
  '''reports/gdi-full-e2e-airtable-persistence-adapter-v1/.*\.json$''',
  '''reports/hotel-census/ac-spice-persistence-reconciliation-v1/PHASE0_1_INVENTORY\.json$''',
  '''reports/hotel-intelligence/ac-spice-reconciliation-v1/SUMMARY-dry\.json$''',
  '''reports/hotel-intelligence/ac-spice-reconciliation-v1/ac-hi-apply-dry\.json$''',
  '''scripts/output/deal-readiness-field-audit-data\.json$''',
]

regexes = [
  # Proven false positives: Dealality property/census identity metadata.
  '''(?i)"identity_key"\s*:''',
  '''(?i)Identity Key"\s*:''',

  # Hotel Explorer session preference storage id (not a credential). Historical STORAGE_KEY= and SESSION_PREF_ID= lines.
  '''(?i)(?:STORAGE_KEY|SESSION_PREF_ID)\s*=\s*"he_measurement_prefs_v1"''',
  '''he_measurement_prefs_v1''',

  # Proven false positives: generated census/research identifier values.
  '''"key"\s*:\s*"(?:ind|dfs|rb|osm)[-_:][A-Za-z0-9._:-]+"''',
  '''"key"\s*:\s*"[A-Fa-f0-9]{40}"''',
  # Radisson/GDI paid-batch research run ids (`deepA_rb_…`, `deepB_rb_…`, `cmiC_rbc_…`, `pass1_…`), not API secrets.
  '''"key"\s*:\s*"(?:deep[ABC]|cmiC|discC|pass[123]|p1|p2|p3|rx_)[A-Za-z0-9._:-]+"''',

  '''(?i)"property_token"\s*:''',
  '''(?i)"property_identity_key"\s*:''',
  '''(?i)"census_identity_key"\s*:''',
  '''(?i)"serpapi_property_token"\s*:''',
  '''(?i)"slotKey"\s*:''',
  '''(?i)"periodKey"\s*:''',
  '''(?i)"propertyKey"\s*:''',
  '''(?i)"identityKey"\s*:''',
  '''(?i)"scenarioKey"\s*:''',
  # GDI Parallel fixture/report identity keys (org_slug__YYYY-MM-DD), not API secrets.
  '''(?i)"dedupeKey"\s*:''',
  '''(?i)"accountTripOccurrenceKey"\s*:''',
  # Hunter→Exa orchestration report IDs (`disc_<hex>`), not provider API secrets.
  # False positive: generic-api-key on "discoveryKey" in zero-paid orch JSON (PR #225).
  '''(?i)"discoveryKey"\s*:''',
  # Historical CMI candidate labels (`GBTA_CANADA_2027_WESTIN_CMI`), not API secrets (PR #290).
  '''(?i)"namedKey"\s*:''',

  # Founder authorization labels for GDI live Full E2E / research persistence (not API secrets).
  '''gdi-bethesda-14segment-(?:live-validation|research-persistence)-v1''',

  # GDI publication package content fingerprints (SHA-256), not API secrets.
  # False positive: generic-api-key on "apiFingerprint" / "expectedFingerprint" in browser verification reports (PR #285).
  '''(?i)"apiFingerprint"\s*:''',
  '''(?i)"expectedFingerprint"\s*:''',
  '''(?i)"contentFingerprintSha256"\s*:''',
  '''(?i)"stagedFingerprint"\s*:''',

  # Public ASP.NET/SharePoint portal URL query tokens (hkey=UUID), not Dealality API secrets (PR #287).
  '''(?i)[?&]hkey=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
  # Public event CMS query tokens (CalendarEventKey=UUID) embedded in research URLs (PR #290).
  '''(?i)[?&]CalendarEventKey=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',

  # Proven placeholders / metadata false positives.
  '''(?i)Authorization:\s*Bearer\s+YOUR_TOKEN''',
  '''(?i)const bannedKeys = \["email", "phone", "mobile", "linkedinUrl", "linkedInUrl", "providerPersonId", "emails", "phones"\];''',
  # Boolean gate variable next to public LinkedIn URL field — not a LinkedIn OAuth client secret (PR #463).
  '''linkedinUrl:\s*linkedinVerified\s*\?''',
  '''https://v5\.airtableusercontent\.com/v3/u/''',

  # Public client-side IHG config captured from HTML.
  '''reports/ihg-destination-page-snippet\.html$''',
  '''reports/ihg-dr-destination\.html$''',
  '''reports/ihg-page-probe\.html$''',

  # Generated Airtable schema inventories. Contain object IDs, not PAT credentials.
  '''reports/operator-setup-form-field-coverage-matrix\.json$''',
  '''reports/operator-field-usage-matrix\.json$''',
  '''reports/operator-setup-field-inventory\.json$''',

  # Captured public browser HTML.
  '''reports/ihg-resources-page-snippet\.html$''',
  '''reports/_tmp-even-dev\.html$''',
  '''fixtures/choice-dev-site-home\.html$''',

  # Static generated/cache artifacts already reviewed; findings are metadata/URLs/IDs.
  '''data/contact-intelligence/evals/gdi-wave1-who-v11-refreeze\.json$''',
  '''data/group-demand-intelligence/hotels/recLuxvwwxID7U2B8/opportunities\.json$''',
  '''data/pilots/bethesda-marriott-001/pilot-master\.json$''',
  '''data/research-engine-v2/serpapi-research-cache/raw/735f2e37c4df8c0d9bc4ba681ee114e8ab9bc6c7\.json$''',
  '''data/research-engine-v2/serpapi-research-cache/raw/c9e2bf2439c5946e9040bd9d0dee0947b92e4a16\.json$''',
  '''reports/bethesda-pilot/day1/2026-10-01/PILOT_MASTER_RECORD\.json$''',
  '''reports/hotel-census/ac-spice-persistence-reconciliation-v1/PHASE0_1_INVENTORY\.json$''',
  '''reports/hotel-intelligence/ac-spice-reconciliation-v1/SUMMARY-dry\.json$''',
  '''reports/hotel-intelligence/ac-spice-reconciliation-v1/ac-hi-apply-dry\.json$''',
  '''scripts/output/deal-readiness-field-audit-data\.json$''',

  # Internal readiness markers, not credentials.
  '''(?i)"finalToken"\s*:\s*"HOTEL_BRAND_[A-Z0-9_-]+"''',

  # Dealality internal identifiers and metadata, not credentials.
  '''(?i)"(?:tokenId|gdiTokenId|adpTokenId|baiTokenId|externalShareTokenId|shareTokenId|contractTokenId|bethesdaTokenId|bethesdaContractTokenId|gdiTokenIdStable|expectedTokenId)"\s*:\s*"(?:sht_|gdisht_)[A-Za-z0-9_-]+"''',
  '''(?i)"(?:hotelKey|propertyKey|identityKey|identity_key|property_identity_key|proposedIdentityKey|expectedCanonicalKey|expectedIdempotencyKey|idempotencyKey|slotKey|Slot Key|formKey|pricing_tier_key|maturityFunnelEnvKey|wRomeExpansionPilotEnvKey)"\s*:\s*"[A-Za-z0-9._:-]+"''',
  '''(?i)(?:propertyKey|identityKey|identity_key|property_identity_key|proposedIdentityKey|slotKey)\s*:\s*["''][A-Za-z0-9._:-]+["'']''',
  '''(?i)(?:TOKEN_ID|BETHESDA_TOKEN|BETHESDA_GDI_CONTRACT_TOKEN_ID)\s*=\s*["''](?:sht_|gdisht_)[A-Za-z0-9_-]+["'']''',
  '''(?i)(?:--token-id=|Token id:\s*`?|Token:\s*)(?:sht_|gdisht_)[A-Za-z0-9_-]+''',
  # Markdown/prose probe lines: tokenId=sht_… (public share capability id, not a bearer/signing secret).
  '''(?i)tokenId=(?:sht_|gdisht_)[A-Za-z0-9_-]+''',
  '''(?i)"auth_sha"\s*:\s*"[A-Fa-f0-9]{64}"''',
  '''(?i)"cohort_keys_hash"\s*:\s*"[A-Fa-f0-9]{40,64}"''',

  # Known public/generated metadata.
  '''(?i)LAST_APIFY_RUN:\s*[A-Za-z0-9_-]+''',
  '''(?i)data-gigya-global-key=["''][A-Za-z0-9_-]+["'']''',
  '''(?i)[''"]sitekey[''"]\s*:\s*[''"][A-Za-z0-9_-]+[''"]''',
  '''(?i)data-cf-beacon=''[^'']+''',

  # Environment variable references, not embedded values.
  '''process\.env\.ACCOR_PUBLIC_API_KEY\s*\|\|''',

  # Internal certification/readiness markers.
  '''(?i)(?:let\s+)?finalToken\s*=\s*["'']HOTEL_BRAND_[A-Z0-9_-]+["'']''',
  '''(?i)finalToken\s*:\s*["'']HOTEL_BRAND_[A-Z0-9_-]+["'']''',

  # Internal Dealality keys and configuration labels.
  '''(?i)(?:maturityFunnelEnvKey|pricing_tier_key)\s*:\s*["''][A-Za-z0-9._:-]+["'']''',
  '''return\s+\{\s*\.\.\.BUDGETS\.OWNERSHIP_MX_L4,\s*key:\s*["'']OWNERSHIP_MX_L4["'']\s*\};''',
  '''(?:if\s*\()?key\s*===\s*["''][A-Za-z0-9._:-]+["'']''',
  '''\.\.\.myDealsDealAuth,''',

  # Tool/provider labels and test/report prose.
  '''tool_access:\s*["'']SerpAPI\+fetch["'']''',
  '''["'']SerpApi["'']''',
  '''readFileSync\(join\(root,\s*["'']api["'']''',
  ''',"Secrets",''',
  '''Rooms\s*/\s*Keys''',
  '''The Keyes Company''',

  # Airtable object IDs are metadata.
  '''Use table ID for more reliable access:\s*tbl[A-Za-z0-9]+''',

  # Empty/example environment declarations are not credentials.
  '''^[A-Z][A-Z0-9_]*=$''',
  '''^\s*#.*(?:app|rec|fld|tbl)[A-Za-z0-9]{14}\s*$''',

  # Public URLs without query-string credentials.
  '''(?i)"(?:sourceUrl|link|url)"\s*:\s*"https?://[^"?\s]+"''',

  # Share capability IDs, not raw capability tokens.
  '''(?i)"token"\s*:\s*"(?:sht_|gdisht_)[A-Za-z0-9_-]+"''',
  '''(?i)preserveTokenId\s*:\s*["''](?:sht_|gdisht_)[A-Za-z0-9_-]+["'']''',
  '''(?i)"(?:preserveShareTokenId|preserveTokenId|shareTokenId)"\s*:\s*"(?:sht_|gdisht_)[A-Za-z0-9_-]+"''',
  '''(?i)-\s*tokenId:\s*`?(?:sht_|gdisht_)[A-Za-z0-9_-]+`?''',
  '''(?i)"(?:sht_|gdisht_)[A-Za-z0-9_-]+"\s*:\s*"[A-Z][A-Z0-9_]+"''',
  '''(?i)"BETHESDA_SHARE_TOKEN"\s*:\s*"(?:sht_|gdisht_)[A-Za-z0-9_-]+"''',

  # Internal report/property keys. Restrict to slug/composite or enum shapes.
  '''"key"\s*:\s*"[a-z0-9]+(?:[-_:][a-z0-9]+)+"''',
  '''"key"\s*:\s*"[A-Z][A-Z0-9_]+"''',
  '''key\s*:\s*["''][A-Z][A-Z0-9_]+["'']''',

  # Internal form/config keys.
  '''(?i)"formKey"\s*:\s*"[A-Za-z0-9._:-]+"''',
  '''(?i)maturityFunnelEnvKey\s*:\s*["''][A-Za-z0-9._:-]+["'']''',

  # Known source-code identifier false positives.
  '''propertyDedupeKey''',
  '''archiveLaterCount''',
  '''row\?\.slotKey\s*===\s*SCENARIO3_SLOT''',
  '''slotKey:\s*SCENARIO3_SLOT''',
  '''const\s+slotKey\s*=\s*v19Plan\.slotKey''',
  '''assert\.equal\(accorDisc\.identity_key,''',
  '''assert\.equal\(m\.proposedIdentityKey,''',

  # Airtable field/key names, not PAT credentials.
  '''(?i)["'']AIRTABLE_[A-Z0-9_]+["'']''',
  '''(?i)["'']airtable[A-Za-z0-9_-]+["'']''',

  # Blank/example env declarations only. Real populated values remain detectable.
  '''^\s*[A-Z][A-Z0-9_]*\s*=\s*(?:#.*)?$''',

  # Share capability token ids (sht_ / gdisht_). Public identifiers, not bearers or signing secrets.
  '''(?i)(?:tokenId|tid)\s*[,:]?\s*["''](?:gdi)?sht_[0-9a-f]{16,}["'']''',

  # ADP staged publication artifact IDs (staged_*), not API keys / signing secrets.
  # Used as superseded-auth / cutover content labels in governed publication reports.
  '''(?i)(?:PRIOR_AUTH_CANDIDATE|priorAuthCandidateSuperseded|priorCandidateStagedVersionId)\s*[:=]\s*["'']staged_[A-Za-z0-9_]+["'']''',
  '''(?i)"(?:priorAuthCandidateSuperseded|priorCandidateStagedVersionId|stagedVersionId|expectedStaged)"\s*:\s*"staged_[A-Za-z0-9_]+"''',
  '''(?i)(?:EXPECTED_STAGED|PRIOR_AUTH_CANDIDATE)\s*=\s*["'']staged_[A-Za-z0-9_]+["'']''',
  '''"staged_[a-z0-9_]+"''',

  # Internal feature/config identifiers, not credentials.
  '''(?i)^[ \t]*[A-Za-z_$][A-Za-z0-9_$]*\s*:\s*["''][A-Z][A-Z0-9_-]+["''],?\s*$''',
  '''(?i)^[ \t]*key\s*:\s*["''][A-Za-z0-9._:-]+["''],?\s*$''',
  '''(?i)^[ \t]*["'']formKey["'']\s*:\s*["''][A-Za-z0-9._:-]+["''],?\s*$''',

  # Blank placeholders in .env.example.
  '''^[ \t]*[A-Z][A-Z0-9_]*[ \t]*=[ \t]*$''',

  # Internal config/registry identifiers.
  '''(?i)^[ \t]*[A-Za-z_$][A-Za-z0-9_$]*\s*:\s*["''][A-Za-z0-9._:-]+["''],?\s*$''',
  '''(?i)^[ \t]*key\s*:\s*["''][A-Za-z0-9._:/-]+["''],?\s*$''',

  # Reviewed internal config identifiers.
  '''^[ \t]*wRomeExpansionPilotEnvKey\s*:\s*["''][A-Z][A-Z0-9_]+["''],?\s*$''',
  '''^[ \t]*key\s*:\s*["''][a-z0-9]+(?:[-_:][a-z0-9]+)+["''],?\s*$''',

  # Exact reviewed false-positive lines.
  '''^HBX_API_KEY=
?$''',
  '''^IHG_PUBLIC_GRAPHQL_API_KEY=
?$''',
  '''^\ \ \ \ wRomeExpansionPilotEnvKey:\ "GDI_WROME_EXPANSION_PILOT_V0",
?$''',
  '''^\ \ \ \ key:\ "rb-choice-fdd-2026",
?$''',
]
# Real Airtable PATs (pat...) remain detectable.
[[rules]]
id = "generic-api-key"

[rules.allowlist]
description = "PR #163/#285/#336/#338 false positives: period ids, job ids, ceiling constant, Airtable record ids, GDI package SHA-256 fingerprints, feature-flag labels, env var name docs"
regexTarget = "secret"
regexes = [
  '''^adp_period_[a-z0-9_]+$''',
  '''^gdi-drc-principal-retrieval-[12]$''',
  '''^APIFY_STAGE1_CEILING$''',
  '''^(?:app|rec|fld|tbl)[A-Za-z0-9]{14}$''',
  # Publication contentFingerprintSha256 / browser verification fingerprints (not credentials).
  '''^[a-f0-9]{64}$''',
  # Feature-flag documentation labels only (FOO=0 / FOO=1). Real tokens are not this shape.
  '''^[A-Z][A-Z0-9_]{2,64}=[01]$''',
  # Bare env var *names* as documentation (exact match only). Real secrets remain detectable.
  '''^(?:APIFY_TOKEN|EXA_API_KEY|FIRECRAWL_API_KEY|SERPAPI_KEY|PARALLEL_API_KEY|MAPBOX_ACCESS_TOKEN|AIRTABLE_API_KEY|GITHUB_TOKEN)$''',
  # Aimbridge ADP period rawResponse hotel amenity prose ("laundry/pressing service") —
  # generic-api-key FP; not a credential (evidence runtime restore).
  '''^laundry/pressing$''',
  # Brand Explorer Presentation Slot Key labels (commercial.kpi.*), not credentials.
  '''^commercial\.kpi\.[a-z0-9_]+$''',
]

# Airtable object identifiers are metadata, not API credentials.
# Real Airtable PATs (pat...) remain detectable.
[[rules]]
id = "airtable-api-key"

[rules.allowlist]
description = "Allow Airtable base, record, field, and table identifiers"
regexTarget = "secret"
regexes = [
  '''^(?:app|rec|fld|tbl)[A-Za-z0-9]{14}$''',
]
