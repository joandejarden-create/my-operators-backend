sable items.","Electronics","All electronic items including televisions, in-room tablets and remote controls are safely sanitized. Remote controls will be disinfected and placed in a sealed bag","SAFE EATS & SAFE DRINKS","Through partnerships with Hyatt and Hilton, a complete and methodical approach to food & beverage preparation protects our guests while not sacrificing our culinary perfection. All that’s left for you to do is enjoy.","Enhanced Sanitization","Strict sanitization processes are in place at all dining venues and hand sanitizer is available at the entrance","Reservations","Tables in dining venues are at least six feet apart and call-ahead seating at à la carte venues limits crowds or queues","Markets (Buffet Dining)","Redesigned approach to buffet dining that includes sealed and protective barriers and staff-assisted service","Digital Menus","Access new digital menus for a true no-touch experience","Bars and Lounges"," Surfaces immediately cleaned and sanitized after each service and twice an hour","Takeout"," Enhanced takeout service available with sealed containers and disposable wares","Room service packaging/delivery adheres to new, improved protocols with each safely sealed","SAFE ADVENTURES","As you can see, we’re taking safety precautions seriously, but do you know what else we’re taking seriously? F-u-n! We promise to not only deliver the confidence you need to enjoy a safe, quality vacation, but also, the nonstop excitement and fun you expect. ","Deep cleaning and disinfection of all public spaces—with an emphasis on high touchpoints—is taking place every hour and a half","Social Distancing","Distance of tables, chairs, sunbeds, etc., are at least six feet apart, family to family","Pools","Swimming pools and hot tubs are sterilized regularly. Social distance standards will apply to water slides and lazy rivers","Kids","Kids and teen club equipment is disinfected and sterilized after use or every half hour ","Sports","All sporting goods and water sport equipment is disinfected and sterilized before and after each use","Gym","Fitness centers are redesigned for social distancing, antibacterial wipes are available and gym equipment is being sanitized routinely","Select a destination first","Unlimited Dining","Unlimited Drinks","Wi-fi","Fitness Center","Travel Professionals","Privacy Policy","Privacy Notice","Cookie Settings","Accessibility","Outdoor Activities","Non-Motorized Water Sports","So Much More","Required","You must agree to the terms of use","Throughout this website, we use the term “Playa” and “Playa Hotels & Resorts” to refer to Playa Hotels & Resorts N.V. and/or one or more of its subsidiaries.","Find a Resort","Dominican Republic","Jamaica","Mexico","locales/en","IAhJNNJiJxZ3I-OuPZMJO1fACzBhE0LEeZ5OYZmkeGw",{"id":330,"extension":13,"meta":331,"stem":601,"__hash__":602},"locales/locales/es.json",{"en":15,"es":16,"path":332,"select-destination-first":333,"contact":334,"check-in-time":335,"check-out-time":336,"by-brand":337,"by-destination":338,"our-resorts":339,"our-brands":340,"dining":341,"drinks":342,"view-all":343,"yes":344,"no":345,"submit":346,"resort":347,"all-contact-info":348,"resort-contact":349,"resort-details":350,"show-details":351,"hide-details":352,"book-now":353,"book-room":353,"building-your-vaca":354,"reservhotel-book-now":183,"features":355,"subscribe":356,"close":357,"home":358,"work":359,"from":360,"terms-and-conditions":361,"offer-expires":362,"filter-all-countries":363,"filter-all-brands":364,"filter-all-offers":365,"filter-adults-only":366,"filter-family-friendly":367,"filter-search-name":368,"copy-link":369,"copied":370,"no-offers-match-filters":371,"view-all-offers":372,"call":373,"all-yours":374,"request-for-quote":375,"group-name":376,"contact-person":377,"phone":378,"email":64,"street-address":379,"street-address-2":380,"city":381,"state-province-region":382,"zip-postal-code":383,"country":384,"group-size":385,"group-age-range":386,"type-of-event":387,"arrival-date":3 ad máxima para esta habitación. Por favor, añada otra habitación.","Check-out Inválido","Ha seleccionado una fecha no disponible fuera de rango. Favor de cambiar fecha para continuar.","Club de viajes de lujo Infinity","Mis Viajes","Herramientas de ventas","Centro de aprendizaje","Ventas – Contactos","Biblioteca de medios","Centro de marketing","Encontrar reservación","Huéspedes","Listo","Regístrate y ahorra","Ofertas","Buscar disponibilidad","Suites","Instalaciones","Restaurantes y bares","Todo","Tour virtual","Vuelo Y Hotel","Registrarse","LLEGADAS Y SALIDAS SEGURAS","","Llegada con contacto reducido","Protectores de vidrio que protegen las interacciones entre los huéspedes y el personal","Equipo de protección personal (EPP)","Todo el personal está equipado con el EPP adecuado, que incluye guantes y guantes.","Desinfección de alto contacto","Todos los bolígrafos, papel, llaves de la habitación o cualquier otro material se desechan o desinfectan después de cada uso.","Equipaje","El equipaje de los huéspedes se desinfecta a la llegada y justo antes de la salida","Transporte","Los automóviles, camionetas, limusinas y carritos de golf se desinfectan frecuentemente durante el día y antes y después de cada uso","Despedida sin contacto","El pago exprés y los métodos de pago sin contacto están disponibles","DESCANSO SEGURO","Descanse tranquilo en habitaciones y suites limpiadas y esterilizadas con las técnicas antivirales más efectivas disponibles. A través de nuestras asociaciones continuas con Hyatt y Hilton, y de líderes en el campo de la limpieza y los servicios de hospitalidad, hemos diseñado una serie de protocolos para cada tipo de alojamiento.","Limpiezas profundas diarias","Los muebles, el minibar y la decoración de cada habitación se limpian y desinfectan diariamente antes de la llegada de los huéspedes. Las limpiezas programadas durante la duración de la estadía solo pueden ser solicitadas por el huésped residente.","EPP","En caso de que algún personal de Playa ingrese a la habitación o suite del huésped, se usará el EPP apropiado.","Sello seguro","Un sello indica cuándo se realizó el último servicio a su habitación"," Limpieza sin contacto","A menos que se solicite, existen protocolos estrictos con respecto a \"no tocar\" u organizar las pertenencias de los huéspedes","Servicios"," Se incluyen gel antibacteriano (desinfectante para manos) y toallitas desinfectantes con artículos de baño sellados. Todos los artículos de tocador son nuevos para cada huésped y la cristalería ha sido reemplazada por artículos desechables de un solo uso.","Electrónicos","Todos los artículos electrónicos, entre ellos televisores, tablets de la habitación y controles remotos, se desinfectan de manera segura. Los controles remotos serán desinfectados y colocados en una bolsa sellada","COMIDAS Y BEBIDAS SEGURAS","A través de alianzas con Hyatt y Hilton, un enfoque completo y metódico para la preparación de alimentos y bebidas protege a nuestros huéspedes sin sacrificar nuestra perfección culinaria. Todo lo que le queda por hacer es disfrutar.","Desinfección mejorada","En todos los restaurantes hay procesos de desinfección estrictos y desinfectante para manos disponible en la entrada","Reservas","Las mesas en los restaurantes están al menos a seis pies (2 metros) de distancia y las reservaciones anticipadas se limitan a menú a la carta para evitar multitudes o filas","Mercados (Comidas tipo buffet)","Enfoque rediseñado para comidas tipo buffet que incluye separaciones selladas y protegidas, además de servicio asistido por el personal.","Menús digitales","Acceda a nuevos menús digitales para evitar tocar menús regulares • Bares y lounges: las superficies se limpian y desinfectan inmediatamente después de cada servicio y dos veces por hora","Bares y lounges","las superficies se limpian y desinfectan inmediatamente después de cada servicio y dos veces por hora","Comida para llevar","Servicio de comida para llevar con contenedores sellados y utensilios desechables","Servicio de habitaciones","el empaque / entrega del servicio de habitaciones se adhiere a protocolos nuevos y mejorados, cada uno sellado de forma segura","AVENTURAS SEGURAS","Como puede ver, estamos tomando en serio las precauciones de seguridad, pero ¿sabe qué más nos estamos tomando en serio? ¡Di-ver-sión! Prometemos no solo brindarle la confianza que necesita para disfrutar de unas vacaciones seguras y de calidad, sino también la emoción y diversión sin límites que espera.","Cada hora y media se realiza una limpieza profunda y desinfección de todos los espacios públicos, con énfasis en los puntos de contacto altos.","Distancia social","Las mesas, sillas, hamacas, etc., están separadas por lo menos seis pies (2 metros), de familia a familia","Piscinas","Las piscinas y las bañeras de hidromasaje se esterilizan regularmente. Los estándares de distancia social se aplicarán a toboganes y ríos artificiales","El equipo del club para niños y adolescentes se desinfecta y esteriliza después de su uso o cada media hora","Deportes","Todos los artículos deportivos y equipos para deportes acuáticos se desinfectan y esterilizan antes y después de cada uso","Gimnasio","Los gimnasios se han rediseñado para el distanciamiento social, hay toallitas antibacterianas disponibles y el equipo se desinfecta de manera rutinaria","Alimentos ilimitados","Bebidas ilimitadas","Gimnasio de última generación","Profesionales de viajes","Política de privacidad","Configuración de cookies","Accesibilidad","Actividades al aire libre","Deportes no motorizados","Y mucho más","Requerido","Debes aceptar los términos de uso.","En este sitio web utilizamos el término \"Playa\" y \"Playa Hotels & Resorts\" para referirnos a Playa Hotels & Resorts N.V., y/o una o más de sus subsidiarias.","Elija un resort","República Dominicana","México","locales/es","QILgKJ4UUrOZGDZIO-Y8hnMAYz07jPMsiXSA_66ik4Y",{"resorts":604,"currentResort":695,"footerTermsMenu":735,"resortsMenu":754,"esResortsMenu":839}, 9,"title":4131},{"value":4128},"\u003Cp>Surrounded by lush mangroves and perched on a long expanse of private white-sand beach, Hyatt Zilara Riviera Maya invites groups to a sophisticated oasis to escape life’s daily rigors. With modern accommodations, gourmet dining, a sophisticated adult atmosphere and over 6,000 square feet of modern conference facilities, Hyatt Zilara Riviera Maya is the ideal oceanfront setting for corporate meetings and incentive trips, with every aspect designed for success.&nbsp;\u003C/p>",{"value":4130},"https://playa-cms-assets.s3.amazonaws.com/media/Hyatt_Zilara_Riviera_Maya/2023/hyatt-zilara-riviera-maya-mice-amber-breakout-room-1.jpg",{"value":4132},"Memorable Meetings",{"description":4134,"fields":4135,"name":4149,"preview":4152,"tags":4153,"templates":4154},"Image with signature title and introduction",{"image":4136,"smallTitle":4139,"largeTitle":4141,"h1Title":4143,"copy":4145,"copyPosition":4146},{"label":949,"type":948,"breakpoints":4137},{"default":4138},{"width":1607,"height":1088},{"label":4140,"type":955},"Small title",{"label":4142,"type":955},"Large title",{"label":4144,"type":955,"enabled":1002},"H1 title",{"label":958,"type":957},{"label":4147,"type":983,"options":4148},"Copy position",{"left":1315,"right":1264},{"label":4150,"group":698,"layouts":4151},"Signature Title",[968,1329,936],"SlicesHyattTwentyTwentyTwoSignatureTitle.jpg",[1533,949],[4155],{"label":4150,"fields":4156},{"copy":4157,"copyPosition":4159,"h1Title":4160,"image":4162,"largeTitle":4164,"smallTitle":4165},{"value":4158},"\u003Cp>From the lush gardens to the bespoke Zen Spa, beauty and romance lie ahead at every inch of this sophisticated adults-only paradise, reminiscent of a modern hacienda. Set beside the crystal-clear Caribbean Sea on a sprawling sugar-white sand beach, Hyatt Zilara Riviera Maya welcomes guests to savor the moment in a breathtaking oceanfront retreat, elevated by Hyatt’s renowned all-inclusive luxury.\u003C/p>",{"value":2345},{"value":
